# =====================================================================
# Profil PROD — activé avec SPRING_PROFILES_ACTIVE=prod
# Les SECRETS et valeurs sensibles viennent UNIQUEMENT des variables
# d'environnement (aucune valeur par défaut de dev ici). Voir .env.prod.example
# =====================================================================
spring:
  main:
    # Démarrage plus léger/rapide (beans créés à la demande) — utile sur instance contrainte.
    # ⚠️ Les beans @Scheduled sont forcés en eager (@Lazy(false)) pour que les crons se déclenchent.
    lazy-initialization: true
  jpa:
    hibernate:
      # Schéma géré par Flyway → Hibernate valide seulement (jamais 'update' en prod).
      ddl-auto: validate
    show-sql: false
    # Laisser true (défaut Spring) : l'app charge des associations LAZY pendant le rendu
    # des vues Thymeleaf et hors transaction. Le passer à false provoque des erreurs
    # (LazyInitialization / entités détachées) côté admin. Cohérent avec le dev.
    open-in-view: true
  flyway:
    enabled: true

# Journalisation plus sobre en production
logging:
  level:
    root: INFO
    ci.esatic.sigep: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

server:
  servlet:
    session:
      cookie:
        # Cookie de session admin : durci explicitement (ne pas dépendre des défauts).
        secure: true
        http-only: true
        # 'lax' et non 'strict' : le retour depuis une page de paiement externe (NovaSend,
        # Stripe) est une navigation cross-site ; en 'strict' le cookie de session ne serait
        # PAS envoyé et l'utilisateur retomberait sur l'écran de connexion après avoir payé.
        # 'lax' n'envoie le cookie que sur les navigations GET de premier niveau : la
        # protection CSRF sur les POST reste entière (et les jetons CSRF Spring restent actifs).
        same-site: ${SESSION_COOKIE_SAMESITE:lax}
        name: SIGEPSESSIONID

app:
  security:
    # En prod : exiger HTTPS et faire confiance au proxy TLS (X-Forwarded-*).
    require-https: ${APP_SECURITY_REQUIRE_HTTPS:true}
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:true}
    # Épinglé explicitement : nombre de reverse proxys de confiance en amont (Render = 1).
    # 1 topologie = 1 valeur. Si un CDN/WAF est ajouté devant (ex. Cloudflare), passer à 2.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:1}
  # Dossier des rapports PDF : volume persistant (sinon perdus au redémarrage du conteneur).
  rapports:
    dossier: ${RAPPORTS_DOSSIER:/data/rapports}

# Actuator : ne pas exposer les détails de santé publiquement
management:
  endpoint:
    health:
      show-details: never

# En prod : ne servir NI l'UI Swagger NI la spec OpenAPI (surface d'API non exposée).
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
