spring:
  # SECURITE (fail-closed) : AUCUN profil par défaut. Un déploiement DOIT définir
  # explicitement SPRING_PROFILES_ACTIVE (=prod en production) + les variables d'env
  # (voir .env.example). Sans profil et sans JWT_SECRET, l'application refuse de démarrer
  # (placeholder ${JWT_SECRET} non résolu) plutôt que de tourner avec une clé de dev connue.
  # En local : le profil 'dev' est activé automatiquement par le spring-boot-maven-plugin
  # (mvnw spring-boot:run) — voir pom.xml. Les tests utilisent @ActiveProfiles("test").
  application:
    name: sigep-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sigep_db}
    username: ${DB_USERNAME:postgres}
    # SECURITE : DB_PASSWORD est OBLIGATOIRE (aucune valeur par défaut). Voir .env.example
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Taille du pool de connexions (rafales de requetes simultanees).
      # Garder <= max_connections de PostgreSQL. Surchargeable par variable d'env.
      maximum-pool-size: ${DB_POOL_MAX:25}
      minimum-idle: ${DB_POOL_MIN:5}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  # Le schéma est géré par Flyway (db/migration). Hibernate se contente de valider.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  jpa:
    hibernate:
      # 'validate' : Hibernate vérifie que les entités correspondent au schéma Flyway.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        # Dialecte volontairement non spécifié : Hibernate le détecte tout seul
        # (sinon avertissement HHH90000025 "does not need to be specified explicitly").
  output:
    ansi:
      enabled: always
  # SMTP pour les notifications par e-mail (activé seulement si app.mail.enabled=true).
  # En prod : définir MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD + MAIL_ENABLED=true.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  # Derrière un reverse proxy qui termine le TLS, respecter X-Forwarded-Proto/Host
  # (sinon l'app croit être en HTTP). Sans effet en accès direct (dev).
  forward-headers-strategy: framework

# Observabilité (Spring Boot Actuator)
management:
  endpoints:
    web:
      exposure:
        # health/info publics (sondes) ; metrics réservé (auth) — voir SecurityConfig
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  health:
    # Le mail est optionnel (journalisé tant que MAIL_ENABLED=false) : son indicateur
    # ne doit pas faire passer toute la sonde en DOWN quand aucun SMTP n'est configuré.
    mail:
      enabled: false
  info:
    env:
      enabled: true

app:
  jwt:
    # SECURITE : JWT_SECRET OBLIGATOIRE en variable d'environnement (min 256 bits, base64). Voir .env.example
    secret: ${JWT_SECRET}
    # Access token court (15 min) : renouvelé via le refresh token sans re-saisie des identifiants.
    expiration: ${JWT_EXPIRATION:900000}
    # Refresh token longue durée (30 jours) — stocké haché et révocable en base.
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
    # SECURITE : clé distincte pour les tokens QR (ne jamais utiliser la même que jwt.secret) — OBLIGATOIRE
    qr-secret: ${JWT_QR_SECRET}
  qr:
    display:
      # SECURITE : l'affichage du QR d'émargement est une preuve de présence physique.
      # Il NE doit PAS être public sur internet. Définir au moins l'un des deux ci-dessous,
      # sinon les pages /api/qr/display renvoient 403 (fail-closed) :
      #  - QR_DISPLAY_KEY : clé secrète que l'écran/kiosque ajoute en paramètre (?key=...)
      #  - QR_DISPLAY_ALLOWED_IPS : IP(s) publiques autorisées (réseau de l'établissement), séparées par des virgules
      key: ${QR_DISPLAY_KEY:}
      allowed-ips: ${QR_DISPLAY_ALLOWED_IPS:}
  rapports:
    dossier: ${RAPPORTS_DOSSIER:rapports}
  mail:
    # Désactivé par défaut : les notifications sont seulement journalisées tant
    # que MAIL_ENABLED=true et un SMTP ne sont pas fournis.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@esatic.ci}
  ai:
    # Analyse IA des statistiques (bouton « Analyser avec l'IA »). Désactivée par défaut.
    # Pour l'activer : AI_ENABLED=true + ANTHROPIC_API_KEY (clé API Anthropic) en variables d'env.
    enabled: ${AI_ENABLED:false}
    # Modèle par défaut (le plus capable). Surchargeable (ex. claude-haiku-4-5 pour réduire le coût).
    model: ${AI_MODEL:claude-opus-4-8}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
  admin:
    # Compte admin initial. Si ADMIN_PASSWORD est vide, un mot de passe aléatoire
    # est généré au démarrage et affiché UNE fois dans les logs (à changer ensuite).
    email: ${ADMIN_EMAIL:admin@esatic.ci}
    password: ${ADMIN_PASSWORD:}
  platform:
    # Propriétaire de la plateforme SaaS. owner-email : contact affiché aux établissements
    # (page abonnement). admin-email/password : compte SUPER ADMIN (espace /plateforme),
    # créé au démarrage s'il n'existe pas ; si le mot de passe est vide, il est généré
    # et affiché UNE fois dans les logs.
    owner-email: ${PLATFORM_OWNER_EMAIL:assalendahjeanfrancois@gmail.com}
    admin-email: ${PLATFORM_ADMIN_EMAIL:${app.platform.owner-email}}
    admin-password: ${PLATFORM_ADMIN_PASSWORD:}
  security:
    # Ne faire confiance au header X-Forwarded-For QUE derrière un reverse proxy de confiance.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    # SECURITE : en production, exiger HTTPS (requêtes non sécurisées rejetées/redirigées).
    # Nécessite un reverse proxy TLS + forward-headers-strategy. Laisser false en dev (HTTP local).
    require-https: ${APP_SECURITY_REQUIRE_HTTPS:false}
    login-rate-limit:
      # Limite anti-bruteforce par IP (fenêtre 1 min). Budgets séparés login / refresh.
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-login: ${LOGIN_RATE_LIMIT_MAX:5}
      max-refresh: ${REFRESH_RATE_LIMIT_MAX:30}
