spring:
  # SECURITE (fail-closed) : AUCUN profil par défaut. Un déploiement DOIT définir
  # explicitement SPRING_PROFILES_ACTIVE (=prod en production) + les variables d'env
  # (voir .env.example). Sans profil et sans JWT_SECRET, l'application refuse de démarrer
  # (placeholder ${JWT_SECRET} non résolu) plutôt que de tourner avec une clé de dev connue.
  # En local : le profil 'dev' est activé automatiquement par le spring-boot-maven-plugin
  # (mvnw spring-boot:run) — voir pom.xml. Les tests utilisent @ActiveProfiles("test").
  application:
    name: sigep-backend
  servlet:
    multipart:
      # Borne la taille des uploads (import Excel) pour éviter un épuisement mémoire.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sigep_db}
    username: ${DB_USERNAME:postgres}
    # SECURITE : DB_PASSWORD est OBLIGATOIRE (aucune valeur par défaut). Voir .env.example
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Taille du pool de connexions (rafales de requetes simultanees).
      # Garder <= max_connections de PostgreSQL. Surchargeable par variable d'env.
      maximum-pool-size: ${DB_POOL_MAX:25}
      minimum-idle: ${DB_POOL_MIN:5}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  # Le schéma est géré par Flyway (db/migration). Hibernate se contente de valider.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  jpa:
    hibernate:
      # 'validate' : Hibernate vérifie que les entités correspondent au schéma Flyway.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        # Dialecte volontairement non spécifié : Hibernate le détecte tout seul
        # (sinon avertissement HHH90000025 "does not need to be specified explicitly").
  output:
    ansi:
      enabled: always
  # SMTP pour les notifications par e-mail (activé seulement si app.mail.enabled=true).
  # En prod : définir MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD + MAIL_ENABLED=true.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Cache applicatif. OPTIONNEL : 'simple' (mémoire locale, défaut) tant que Redis n'est pas
  # provisionné. Pour activer le cache distribué : CACHE_TYPE=redis + REDIS_URL (voir ci-dessous).
  cache:
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: ${CACHE_TTL_MS:600000}   # 10 min par défaut
  data:
    redis:
      # Redis OPTIONNEL (cache distribué + rate-limit partagé). Par défaut ABSENT → repli mémoire.
      # Pour l'activer, définir la variable d'env SPRING_DATA_REDIS_URL (Spring la relie tout seul),
      # ex. rediss://default:<password>@<host>:<port> (Upstash/Render), + CACHE_TYPE=redis et/ou
      # RATE_LIMIT_REDIS_ENABLED=true. NE PAS déclarer d'url vide ici : Lettuce refuse "" au démarrage.
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

server:
  # ${PORT} : l'hébergeur (Render, etc.) injecte le port à écouter. 8080 en local.
  port: ${PORT:8080}
  # Derrière un reverse proxy qui termine le TLS, respecter X-Forwarded-Proto/Host
  # (sinon l'app croit être en HTTP). Sans effet en accès direct (dev).
  forward-headers-strategy: framework
  # Borne la taille des en-têtes HTTP (anti-abus). 16 Ko suffisent largement.
  max-http-request-header-size: ${HTTP_MAX_HEADER_SIZE:16KB}
  tomcat:
    # Durcissement anti-flood : échouer vite plutôt que d'empiler indéfiniment les connexions.
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:2000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    # Délai max pour recevoir la ligne de requête + en-têtes (anti-slowloris).
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:10s}
    # Borne le corps des POST de formulaire et la quantité « avalée » sur requête rejetée.
    max-http-form-post-size: ${TOMCAT_MAX_POST_SIZE:2MB}
    max-swallow-size: ${TOMCAT_MAX_SWALLOW_SIZE:2MB}

# Observabilité (Spring Boot Actuator)
management:
  endpoints:
    web:
      exposure:
        # health/info publics (sondes) ; metrics + prometheus réservés ADMIN — voir SecurityConfig
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  health:
    # Le mail est optionnel (journalisé tant que MAIL_ENABLED=false) : son indicateur
    # ne doit pas faire passer toute la sonde en DOWN quand aucun SMTP n'est configuré.
    mail:
      enabled: false
    # Redis est une couche de PERFORMANCE optionnelle (cache + rate-limit distribué) : une
    # panne Redis ne doit JAMAIS faire échouer /actuator/health (sinon Render coupe le service).
    # N'activer (=true) que si Redis est provisionné ET considéré critique.
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  info:
    env:
      # SECURITE : ne pas exposer les propriétés d'environnement via /actuator/info (public).
      enabled: false

# Suivi des erreurs (Sentry) — INERTE tant que SENTRY_DSN n'est pas défini.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:dev}
  traces-sample-rate: ${SENTRY_TRACES_RATE:0.1}
  # Ne jamais transmettre de données personnelles (RGPD).
  send-default-pii: false

# Documentation API (OpenAPI / Swagger UI). Endpoints protégés (auth requise) ; UI désactivée en prod.
springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # SECURITE : JWT_SECRET OBLIGATOIRE en variable d'environnement (min 256 bits, base64). Voir .env.example
    secret: ${JWT_SECRET}
    # Access token court (15 min) : renouvelé via le refresh token sans re-saisie des identifiants.
    expiration: ${JWT_EXPIRATION:900000}
    # Refresh token longue durée (30 jours) — stocké haché et révocable en base.
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
    # SECURITE : clé distincte pour les tokens QR (ne jamais utiliser la même que jwt.secret) — OBLIGATOIRE
    qr-secret: ${JWT_QR_SECRET}
  qr:
    # SECURITE (E3) : validité COURTE du QR d'émargement en ligne pour réduire la fenêtre
    # de relais d'une capture d'écran (un QR photographié n'est réutilisable que quelques
    # secondes). Le mode hors-ligne, lui, tolère l'expiration (preuve via l'iat signé).
    expiration-ms: ${QR_EXPIRATION_MS:45000}
    refresh-seconds: ${QR_REFRESH_SECONDS:15}
    display:
      # SECURITE : l'affichage du QR d'émargement est une preuve de présence physique.
      # Il NE doit PAS être public sur internet. Définir au moins l'un des deux ci-dessous,
      # sinon les pages /api/qr/display renvoient 403 (fail-closed) :
      #  - QR_DISPLAY_KEY : clé secrète que l'écran/kiosque ajoute en paramètre (?key=...)
      #  - QR_DISPLAY_ALLOWED_IPS : IP(s) publiques autorisées (réseau de l'établissement), séparées par des virgules
      key: ${QR_DISPLAY_KEY:}
      allowed-ips: ${QR_DISPLAY_ALLOWED_IPS:}
  rapports:
    dossier: ${RAPPORTS_DOSSIER:rapports}
  mail:
    # Désactivé par défaut : les notifications sont seulement journalisées tant
    # que MAIL_ENABLED=true et un SMTP ne sont pas fournis.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@esatic.ci}
  ai:
    # Analyse IA des statistiques (bouton « Analyser avec l'IA »). Désactivée par défaut.
    # Pour l'activer : AI_ENABLED=true + ANTHROPIC_API_KEY (clé API Anthropic) en variables d'env.
    enabled: ${AI_ENABLED:false}
    # Modèle par défaut (le plus capable, réservé au plan ENTERPRISE).
    model: ${AI_MODEL:claude-opus-4-8}
    # Modèle standard (plans inférieurs) — maîtrise du coût par plan (E10).
    model-standard: ${AI_MODEL_STANDARD:claude-haiku-4-5}
  analytics:
    # Analytics web sans cookie (Plausible). Vide = désactivé. Ex. PLAUSIBLE_DOMAIN=sigep.store
    plausible-domain: ${PLAUSIBLE_DOMAIN:}
  onboarding:
    # C5 : auto-validation des inscriptions self-service. false = validation manuelle par le
    # super-admin (défaut, comportement actuel). true = espace actif immédiatement.
    auto-validation: ${ONBOARDING_AUTO_VALIDATION:false}
  billing:
    # Devise de facturation (code ISO en minuscules). SOURCE UNIQUE : sert à l'affichage ET à
    # Stripe — les deux ne peuvent donc pas diverger. EUR a 2 décimales : la conversion vers
    # l'unité Stripe (centimes) est automatique (cf. StripeService.versUniteStripe).
    currency: ${BILLING_CURRENCY:eur}
    symbole: ${BILLING_SYMBOLE:€}
  plans:
    # Quota d'enseignants du plan FREE (source unique — M1).
    free-max-enseignants: ${FREE_MAX_ENSEIGNANTS:10}
    # Tarifs mensuels en unité MAJEURE de la devise (ex. 20 = 20 €).
    pro-price: ${PLAN_PRO_PRICE:20}
    enterprise-price: ${PLAN_ENTERPRISE_PRICE:146}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
  admin:
    # Compte admin initial. Si ADMIN_PASSWORD est vide, un mot de passe aléatoire
    # est généré au démarrage et affiché UNE fois dans les logs (à changer ensuite).
    email: ${ADMIN_EMAIL:admin@esatic.ci}
    password: ${ADMIN_PASSWORD:}
  # URL publique de base (liens de retour Stripe, e-mails). En local : http://localhost:8080
  base-url: ${APP_BASE_URL:https://sigep.store}
  platform:
    # Propriétaire de la plateforme SaaS. owner-email : identité du SUPER ADMIN (détection).
    # admin-email/password : compte SUPER ADMIN (espace /plateforme), créé au démarrage s'il
    # n'existe pas ; si le mot de passe est vide, il est généré et affiché UNE fois dans les logs.
    owner-email: ${PLATFORM_OWNER_EMAIL:assalendahjeanfrancois@gmail.com}
    admin-email: ${PLATFORM_ADMIN_EMAIL:${app.platform.owner-email}}
    admin-password: ${PLATFORM_ADMIN_PASSWORD:}
    # Marque affichée dans l'interface (chrome admin, pages QR). Neutre = mono-marque SIGEP.
    brand-name: ${PLATFORM_BRAND_NAME:SIGEP}
    # Adresse de contact/support affichée publiquement (landing, login, page abonnement).
    # Neutre par défaut — ne jamais coder d'e-mail personnel dans les templates.
    contact-email: ${PLATFORM_CONTACT_EMAIL:contact@sigep.store}
    # Numéro Mobile Money d'encaissement de la plateforme (repli si l'établissement n'en fixe pas).
    # Vide par défaut : à définir en variable d'env (ne jamais coder de numéro personnel).
    mobile-money: ${PLATFORM_MOBILE_MONEY:}
  stripe:
    # Paiement en ligne (Stripe Checkout). Désactivé par défaut : activer avec STRIPE_ENABLED=true
    # + STRIPE_SECRET_KEY. Le webhook exige STRIPE_WEBHOOK_SECRET.
    # La DEVISE n'est PAS définie ici : elle vient de app.billing.currency (source unique),
    # pour qu'on ne puisse jamais encaisser dans une devise différente de celle affichée.
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mobile-money:
    # Webhook Mobile Money générique (C7). Secret partagé exigé (fail-closed si vide).
    # L'agrégateur (CinetPay/PayDunya/Wave/Orange) poste sur /api/paiement/mobile-money/webhook.
    webhook-secret: ${MOBILE_MONEY_WEBHOOK_SECRET:}
  security:
    # Ne faire confiance au header X-Forwarded-For QUE derrière un reverse proxy de confiance.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    # SECURITE : en production, exiger HTTPS (requêtes non sécurisées rejetées/redirigées).
    # Nécessite un reverse proxy TLS + forward-headers-strategy. Laisser false en dev (HTTP local).
    require-https: ${APP_SECURITY_REQUIRE_HTTPS:false}
    login-rate-limit:
      # Rate-limiting par IP (fenêtre 1 min, réponse HTTP 429). Budgets stricts par endpoint
      # sensible + un budget global anti-flood, toutes routes. Voir RateLimitFilter.
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-login: ${LOGIN_RATE_LIMIT_MAX:5}
      max-refresh: ${REFRESH_RATE_LIMIT_MAX:30}
      max-signup: ${SIGNUP_RATE_LIMIT_MAX:5}
      max-admin-login: ${ADMIN_LOGIN_RATE_LIMIT_MAX:10}
      # Budget global par IP, toutes routes (0 = désactivé). Généreux : plusieurs utilisateurs
      # partagent souvent une même IP (NAT d'établissement).
      max-global: ${RATE_LIMIT_MAX_GLOBAL:300}
      # Plafond de clés en mémoire (garde anti-épuisement du limiteur lui-même).
      max-keys: ${RATE_LIMIT_MAX_KEYS:50000}
      # Rate-limit DISTRIBUÉ via Redis (partagé entre instances, survit aux redémarrages).
      # Nécessite REDIS_URL. false = compteurs en mémoire locale (défaut, mono-instance).
      redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:false}
      # Budget par UTILISATEUR authentifié (en plus du budget par IP) sur les endpoints coûteux
      # (génération de rapports, import Excel, analyse IA). Empêche un compte de saturer l'instance.
      max-heavy-per-user: ${RATE_LIMIT_MAX_HEAVY_PER_USER:20}
      # Budget strict de l'analyse IA (appels Claude facturés) par IP/min.
      max-ai: ${RATE_LIMIT_MAX_AI:5}
