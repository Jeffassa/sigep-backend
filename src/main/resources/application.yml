spring:
  application:
    name: sigep-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sigep_db}
    username: ${DB_USERNAME:postgres}
    # SECURITE : définir DB_PASSWORD en variable d'environnement en production
    password: ${DB_PASSWORD:sigep_secret_password}
    driver-class-name: org.postgresql.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    hibernate:
      # SECURITE : changer en 'validate' ou 'none' en production
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  output:
    ansi:
      enabled: always

server:
  port: 8080

app:
  jwt:
    # SECURITE : définir JWT_SECRET en variable d'environnement en production (min 256 bits)
    secret: ${JWT_SECRET:c2lnZXAtYmFja2VuZC1qd3Qtc2VjcmV0LWtleS1mb3ItZXNhdGljLTIwMjYtcHJvZA==}
    expiration: ${JWT_EXPIRATION:86400000}
    # SECURITE : clé distincte pour les tokens QR (ne jamais utiliser la même que jwt.secret)
    qr-secret: ${JWT_QR_SECRET:cXItc2lnZXAtc2VjcmV0LWtleS1mb3ItcXItdG9rZW5zLWVzYXRpYy0yMDI2}
  rapports:
    dossier: ${RAPPORTS_DOSSIER:rapports}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
