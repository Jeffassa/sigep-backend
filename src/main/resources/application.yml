spring:
  application:
    name: sigep-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sigep_db}
    username: ${DB_USERNAME:postgres}
    # SECURITE : DB_PASSWORD est OBLIGATOIRE (aucune valeur par défaut). Voir .env.example
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    hibernate:
      # SECURITE : 'validate' par défaut (prod) ; mettre 'update' en dev via JPA_DDL_AUTO
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  output:
    ansi:
      enabled: always

server:
  port: 8080

app:
  jwt:
    # SECURITE : JWT_SECRET OBLIGATOIRE en variable d'environnement (min 256 bits, base64). Voir .env.example
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
    # SECURITE : clé distincte pour les tokens QR (ne jamais utiliser la même que jwt.secret) — OBLIGATOIRE
    qr-secret: ${JWT_QR_SECRET}
  rapports:
    dossier: ${RAPPORTS_DOSSIER:rapports}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
  admin:
    # Compte admin initial. Si ADMIN_PASSWORD est vide, un mot de passe aléatoire
    # est généré au démarrage et affiché UNE fois dans les logs (à changer ensuite).
    email: ${ADMIN_EMAIL:admin@esatic.ci}
    password: ${ADMIN_PASSWORD:}
  security:
    # Ne faire confiance au header X-Forwarded-For QUE derrière un reverse proxy de confiance.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
