<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragments des pages PUBLIQUES (accueil, inscription, pages légales).

  Pourquoi un fragment distinct de « admin/fragments » : ces deux familles de pages ont des
  intentions opposées face aux moteurs de recherche. Une page publique doit être indexée, porter
  une URL canonique et une carte de partage ; une page d'administration ne doit jamais l'être.
  Tant qu'elles partageaient le même en-tête, toute balise ajoutée pour l'une retombait sur
  l'autre — et l'en-tête commun déclarait « index,follow » sur une vingtaine de pages privées.

  Second effet : les pages légales n'affichent aucune icône, mais héritaient de la police
  d'icônes de l'administration — 372 Ko téléchargés pour rien. Elle est ici optionnelle.
-->
<head th:fragment="head(titre, description, icones)">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

    <title th:text="${titre}">SIGEP</title>
    <meta name="description" th:content="${description}"/>

    <!-- Ces pages ont vocation à être trouvées : l'intention est écrite ici, une fois pour toutes. -->
    <meta name="robots" content="index,follow,max-image-preview:large"/>
    <link rel="canonical" th:href="${canonicalUrl}"/>

    <!-- Carte de partage. Le lien de ce produit circule surtout par messagerie : sans ces
         balises, il arrive sous forme d'URL nue, sans titre, sans résumé et sans image. -->
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" th:content="${marque} ?: 'SIGEP'"/>
    <meta property="og:title" th:content="${titre}"/>
    <meta property="og:description" th:content="${description}"/>
    <meta property="og:url" th:content="${canonicalUrl}"/>
    <meta property="og:locale" content="fr_FR"/>
    <meta property="og:image" th:content="${baseUrl} + '/images/og-sigep.png'"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:image:alt" content="SIGEP — émargement des enseignants par QR code"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" th:content="${titre}"/>
    <meta name="twitter:description" th:content="${description}"/>
    <meta name="twitter:image" th:content="${baseUrl} + '/images/og-sigep.png'"/>

    <link rel="icon" th:href="@{/favicon.ico}" sizes="any"/>
    <link rel="apple-touch-icon" th:href="@{/images/logo_sigep.png}"/>
    <meta name="theme-color" content="#0a0a0b"/>

    <!-- Analytics sans cookie (Plausible) — activé seulement si un domaine est configuré -->
    <script th:if="${plausibleDomain}" defer th:data-domain="${plausibleDomain}"
            src="https://plausible.io/js/script.js"></script>

    <!-- Thème : appliqué AVANT le rendu pour éviter le flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('sigep-theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>

    <link rel="stylesheet" th:href="@{/css/tailwind.css}"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.cdnfonts.com/css/geist" rel="stylesheet"/>
    <!-- Police d'icônes : demandée seulement par les pages qui en affichent. -->
    <link th:if="${icones}" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/sigep.css}"/>
</head>
<body>

<!--
  Identité machine du site, posée sur la seule page d'accueil.

  Trois nœuds seulement, et uniquement ce que la page montre vraiment : décrire en données ce qui
  n'est pas visible à l'écran est une consigne explicitement sanctionnée par les moteurs.
-->
<th:block th:fragment="donneesStructurees">
    <script type="application/ld+json" th:inline="text">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "[[${baseUrl}]]/#organisation",
          "name": "[[${marque} ?: 'SIGEP']]",
          "url": "[[${baseUrl}]]/",
          "logo": "[[${baseUrl}]]/images/logo_sigep.png",
          "email": "[[${contactPlateforme}]]",
          "areaServed": "CI",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "sales",
            "email": "[[${contactPlateforme}]]",
            "availableLanguage": "fr"
          }
        },
        {
          "@type": "WebSite",
          "@id": "[[${baseUrl}]]/#site",
          "url": "[[${baseUrl}]]/",
          "name": "[[${marque} ?: 'SIGEP']]",
          "inLanguage": "fr",
          "publisher": { "@id": "[[${baseUrl}]]/#organisation" }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "[[${baseUrl}]]/#logiciel",
          "name": "[[${marque} ?: 'SIGEP']]",
          "url": "[[${baseUrl}]]/",
          "applicationCategory": "BusinessApplication",
          "applicationSubCategory": "Gestion des présences et du temps d'enseignement",
          "operatingSystem": "Web, Android, iOS",
          "inLanguage": "fr",
          "publisher": { "@id": "[[${baseUrl}]]/#organisation" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "[[${devise}]]",
            "description": "Offre gratuite : émargement par QR code, planning et rapports d'heures.",
            "url": "[[${baseUrl}]]/inscription",
            "availability": "https://schema.org/InStock"
          }
        }
      ]
    }
    </script>
</th:block>

</body>
</html>
