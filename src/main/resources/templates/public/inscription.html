<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('SIGEP · Inscrire mon établissement')}"></head>
<body class="min-h-screen flex items-center justify-center px-5 py-10">

<main class="w-full max-w-[460px]" data-reveal>

    <!-- Marque -->
    <div class="text-center mb-8">
        <a th:href="@{/}" class="inline-flex items-baseline gap-2">
            <span class="font-serif text-[44px] leading-none tracking-tight">SIGEP</span>
        </a>
        <p class="font-mono text-[11px] uppercase tracking-[0.3em] text-muted mt-2">Créer l'espace de votre établissement</p>
    </div>

    <!-- Carte -->
    <div class="glass-strong rounded-3xl p-8">
        <h2 class="font-serif text-[26px] mb-1">Bienvenue.</h2>
        <p class="text-[14px] text-muted mb-6">Commencez gratuitement — vous serez l'administrateur de l'espace.</p>

        <div id="erreur" class="hidden items-center gap-2 p-3 mb-4 rounded-xl text-[13px]"
             style="background:rgba(186,26,26,.08);color:#7a0010;border:1px solid rgba(186,26,26,.2)">
            <span class="material-symbols-rounded text-[18px]">error</span>
            <span id="erreurTexte">Erreur.</span>
        </div>

        <form id="form" class="space-y-4">
            <div>
                <label class="block font-mono text-[11px] uppercase tracking-wider text-muted mb-2">Nom de l'établissement</label>
                <input id="nomEtablissement" type="text" required list="ecolesList" autocomplete="off"
                       class="w-full h-12 px-4 rounded-xl bg-white/60 border border-line text-ink focus:outline-none focus:border-ink focus:ring-1 focus:ring-ink transition"
                       placeholder="Commencez à saisir le nom…"/>
                <!-- Suggestions d'établissements (Côte d'Ivoire). Liste non exhaustive :
                     la saisie libre reste possible pour tout autre établissement. -->
                <datalist id="ecolesList">
                    <option value="Université Félix Houphouët-Boigny"></option>
                    <option value="Université Nangui Abrogoua"></option>
                    <option value="Université Péléforo Gon Coulibaly"></option>
                    <option value="Université de Man"></option>
                    <option value="Université Alassane Ouattara"></option>
                    <option value="Université Jean Lorougnon Guédé"></option>
                    <option value="Université Virtuelle de Côte d'Ivoire"></option>
                    <option value="Institut National Polytechnique Félix Houphouët-Boigny"></option>
                    <option value="École Normale Supérieure"></option>
                    <option value="École Supérieure de Commerce d'Abidjan"></option>
                    <option value="Université Internationale d'Abidjan"></option>
                    <option value="Université Française d'Abidjan"></option>
                    <option value="Université Polytechnique Internationale"></option>
                    <option value="Université Protestante d'Afrique de l'Ouest"></option>
                    <option value="Université Saint Paul"></option>
                    <option value="Université des Lagunes"></option>
                    <option value="Institut Universitaire d'Abidjan"></option>
                    <option value="École Supérieure des Métiers Appliqués de Côte d'Ivoire"></option>
                    <option value="École Supérieure de Commerce Castaing"></option>
                    <option value="Académie de l'Entrepreneuriat et des Métiers"></option>
                    <option value="Académie de Gestion et d'Hôtellerie"></option>
                    <option value="École Polytechnique des Oscars"></option>
                    <option value="Académie Internationale des Sciences et Techniques"></option>
                    <option value="Université Polytechnique de Bingerville"></option>
                    <option value="Université Internationale Nayeba"></option>
                    <option value="École Polytechnique Léonard de Vinci"></option>
                    <option value="Institut Ivoirien de Technologie"></option>
                </datalist>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-mono text-[11px] uppercase tracking-wider text-muted mb-2">Prénom</label>
                    <input id="adminPrenom" type="text"
                           class="w-full h-12 px-4 rounded-xl bg-white/60 border border-line text-ink focus:outline-none focus:border-ink focus:ring-1 focus:ring-ink transition"/>
                </div>
                <div>
                    <label class="block font-mono text-[11px] uppercase tracking-wider text-muted mb-2">Nom</label>
                    <input id="adminNom" type="text"
                           class="w-full h-12 px-4 rounded-xl bg-white/60 border border-line text-ink focus:outline-none focus:border-ink focus:ring-1 focus:ring-ink transition"/>
                </div>
            </div>
            <div>
                <label class="block font-mono text-[11px] uppercase tracking-wider text-muted mb-2">Email administrateur</label>
                <input id="adminEmail" type="email" required
                       class="w-full h-12 px-4 rounded-xl bg-white/60 border border-line text-ink focus:outline-none focus:border-ink focus:ring-1 focus:ring-ink transition"
                       placeholder="vous@etablissement.ci"/>
            </div>
            <div>
                <label class="block font-mono text-[11px] uppercase tracking-wider text-muted mb-2">Mot de passe</label>
                <div class="relative">
                    <input id="adminPassword" type="password" required minlength="8"
                           class="w-full h-12 px-4 pr-11 rounded-xl bg-white/60 border border-line text-ink focus:outline-none focus:border-ink focus:ring-1 focus:ring-ink transition"
                           placeholder="8 caractères minimum"/>
                    <button type="button" data-toggle="adminPassword" aria-label="Afficher le mot de passe"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink transition">
                        <span class="material-symbols-rounded text-[20px]">visibility</span>
                    </button>
                </div>
            </div>
            <div>
                <label class="block font-mono text-[11px] uppercase tracking-wider text-muted mb-2">Confirmer le mot de passe</label>
                <div class="relative">
                    <input id="adminPasswordConfirm" type="password" required minlength="8"
                           class="w-full h-12 px-4 pr-11 rounded-xl bg-white/60 border border-line text-ink focus:outline-none focus:border-ink focus:ring-1 focus:ring-ink transition"
                           placeholder="Retapez le même mot de passe"/>
                    <button type="button" data-toggle="adminPasswordConfirm" aria-label="Afficher le mot de passe"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink transition">
                        <span class="material-symbols-rounded text-[20px]">visibility</span>
                    </button>
                </div>
            </div>
            <button id="submit" type="submit"
                    class="btn btn-ink w-full h-12 rounded-xl font-medium flex items-center justify-center gap-2 mt-2">
                Créer mon espace
                <span class="material-symbols-rounded text-[20px]">arrow_forward</span>
            </button>
        </form>

        <p class="text-center text-[13px] text-muted mt-6">
            Déjà inscrit ? <a th:href="@{/admin-login}" class="text-ink underline underline-offset-2">Se connecter</a>
        </p>
    </div>
</main>

<script th:inline="none">
(function () {
    var form = document.getElementById('form');
    var btn = document.getElementById('submit');
    var box = document.getElementById('erreur');
    var txt = document.getElementById('erreurTexte');

    /* Œil afficher/masquer sur chaque champ mot de passe */
    document.querySelectorAll('[data-toggle]').forEach(function (b) {
        b.addEventListener('click', function () {
            var inp = document.getElementById(b.getAttribute('data-toggle'));
            var icon = b.querySelector('.material-symbols-rounded');
            if (inp.type === 'password') { inp.type = 'text'; icon.textContent = 'visibility_off'; }
            else { inp.type = 'password'; icon.textContent = 'visibility'; }
        });
    });

    function erreur(message) {
        txt.textContent = message;
        box.classList.remove('hidden');
        box.classList.add('flex');
        btn.disabled = false;
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        box.classList.add('hidden');
        btn.disabled = true;

        // Les deux mots de passe doivent correspondre.
        var mdp = document.getElementById('adminPassword').value;
        var mdp2 = document.getElementById('adminPasswordConfirm').value;
        if (mdp !== mdp2) { erreur('Les deux mots de passe ne correspondent pas.'); return; }

        var payload = {
            nomEtablissement: document.getElementById('nomEtablissement').value.trim(),
            adminPrenom: document.getElementById('adminPrenom').value.trim(),
            adminNom: document.getElementById('adminNom').value.trim(),
            adminEmail: document.getElementById('adminEmail').value.trim(),
            adminPassword: document.getElementById('adminPassword').value
        };

        fetch('/api/saas/etablissements', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function (r) {
            if (r.ok) { window.location = '/admin-login?registered=1'; return; }
            if (r.status === 429) { erreur('Trop de tentatives. Réessayez dans une minute.'); return; }
            return r.json().then(function (j) {
                erreur((j && j.message) ? j.message : 'Inscription impossible pour le moment.');
            }).catch(function () { erreur('Inscription impossible pour le moment.'); });
        }).catch(function () { erreur('Serveur injoignable. Réessayez dans un instant.'); });
    });
})();
</script>

</body>
</html>
