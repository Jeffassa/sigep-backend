<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('SIGEP | Messages')}"></head>
<body>

<div th:replace="~{admin/fragments :: topbar('messages')}"></div>

<main class="max-w-[900px] mx-auto px-5 md:px-8 py-10 pb-36">

    <div class="mb-8" data-reveal>
        <p class="surtitre">Communication</p>
        <h1 class="titre-page">Messages</h1>
        <p class="chapeau">Envoyez un e-mail à un enseignant précis ou à tous.</p>
    </div>

    <div data-flash th:if="${success}" class="feuille mb-5 flex items-center gap-2 text-[13px]" data-reveal
         style="background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35)">
        <svg th:replace="~{admin/fragments :: coche}"></svg><span th:text="${success}">OK</span>
    </div>

    <form th:action="@{/admin/messages}" method="post" class="feuille flex flex-col gap-5" data-reveal>
        <label class="flex flex-col gap-1.5 text-[13px]">
            <span class="etiquette mb-0">Destinataire</span>
            <select name="destinataire" required
                    class="champ px-3 h-11 text-[14px] cursor-pointer">
                <option value="ALL">Tous les enseignants</option>
                <option th:each="e : ${enseignants}" th:value="${e.id}"
                        th:text="${e.prenom + ' ' + e.nom + ' (' + e.user.email + ')'}">Prof</option>
            </select>
        </label>
        <label class="flex flex-col gap-1.5 text-[13px]">
            <span class="etiquette mb-0">Sujet</span>
            <input type="text" name="sujet" required maxlength="150"
                   class="champ px-3 h-11 text-[14px]"/>
        </label>
        <label class="flex flex-col gap-1.5 text-[13px]">
            <span class="etiquette mb-0">Message</span>
            <textarea name="corps" required rows="7"
                      class="champ px-3 py-2.5 text-[14px] resize-y"></textarea>
        </label>
        <button type="submit" class="btn btn-ink h-12 px-6 flex items-center justify-center gap-2 w-fit text-[15px] font-medium">
            <span class="material-symbols-rounded text-[20px]">send</span> Envoyer
        </button>
    </form>

</main>

<div th:replace="~{admin/fragments :: dock('messages')}"></div>
<div th:replace="~{admin/fragments :: palette}"></div>
<div th:replace="~{admin/fragments :: scripts}"></div>

</body>
</html>
