<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" data-toujours-clair>
<head th:replace="~{admin/fragments :: head('SIGEP | Connexion')}"></head>
<body class="porte">
<aside class="porte-nuit">
    <a th:href="@{/}" class="marque">SIGEP</a>
    <p class="accroche">Chaque heure de cours, <em>signée.</em></p>
</aside>
<div class="porte-page">
<main>
    <a th:href="@{/}" class="retour-accueil">← Retour à l'accueil</a>
    <h1 class="titre-page">Connexion</h1>
    <div class="feuille">

        <div th:if="${error}"
             class="note note-alerte">
            <span th:text="${error}">Erreur.</span>
        </div>
        <div th:if="${logout}"
             class="note">
            <span th:text="${logout}">Déconnecté.</span>
        </div>
        <div th:if="${param.registered}"
             class="note note-bloc">
            <p class="font-medium text-[14px]">Inscription reçue</p>
            <p class="text-muted mt-1">Un e-mail vous préviendra dès l'activation de votre espace.</p>
        </div>
        <div th:if="${param.pending}"
             class="note note-bloc">
            <p class="font-medium text-[14px]">Espace pas encore activé</p>
            <p class="text-muted mt-1">Un e-mail vous préviendra dès son activation.</p>
        </div>
        <div th:if="${param.rejected}"
             class="note note-alerte note-bloc">
            <p class="font-medium text-[14px]">Inscription non retenue</p>
            <p class="text-muted mt-1"><a th:href="'mailto:' + ${contactPlateforme}" href="mailto:contact@sigep.store" class="underline">Nous écrire</a></p>
        </div>

        <form th:action="@{/admin-login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="etiquette">E-mail</label>
                <div class="relative">
                    <input id="username" name="username" type="email" required
                           class="w-full h-12 px-4 champ text-ink"
                           autocomplete="username"/>
                </div>
            </div>
            <div>
                <label for="password" class="etiquette">Mot de passe</label>
                <div class="relative">
                    <input id="password" name="password" type="password" required
                           class="w-full h-12 pl-4 pr-12 champ text-ink"
                           autocomplete="current-password"/>
                    <button type="button" id="togglePwd" aria-label="Afficher le mot de passe"
                            class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg flex items-center justify-center text-muted hover:text-ink transition">
                        <span class="material-symbols-rounded text-[20px]" id="togglePwdIcon">visibility</span>
                    </button>
                </div>
            </div>
            <button type="submit"
                    class="btn btn-ink w-full h-12 rounded-xl font-medium flex items-center justify-center gap-2 mt-2">
                Se connecter
                <span class="material-symbols-rounded text-[20px]">arrow_forward</span>
            </button>
        </form>
    </div>
</main>
</div>

<script>
(function () {
    var btn = document.getElementById('togglePwd');
    var inp = document.getElementById('password');
    var ic  = document.getElementById('togglePwdIcon');
    if (!btn || !inp || !ic) return;
    btn.addEventListener('click', function () {
        var show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        ic.textContent = show ? 'visibility_off' : 'visibility';
        btn.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
        inp.focus();
    });
})();
</script>

</body>
</html>
