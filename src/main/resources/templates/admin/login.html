<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('SIGEP | Connexion')}"></head>
<body class="min-h-screen flex items-center justify-center px-5">

<main class="w-full max-w-[420px]" data-reveal>

    <!-- Marque -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-ink text-white mb-5 glass-card">
            <span class="material-symbols-rounded fill">shield_person</span>
        </div>
        <h1 class="font-serif text-[52px] leading-none tracking-tight">SIGEP</h1>
        <p class="font-mono text-[11px] uppercase tracking-[0.3em] text-muted mt-2">Administration · ESATIC</p>
    </div>

    <!-- Carte -->
    <div class="glass-strong rounded-3xl p-8">
        <h2 class="font-serif text-[26px] mb-1">Bon retour.</h2>
        <p class="text-[14px] text-muted mb-6">Connectez-vous à votre espace.</p>

        <div th:if="${error}"
             class="flex items-center gap-2 p-3 mb-4 rounded-xl text-[13px]"
             style="background:rgba(186,26,26,.08);color:#7a0010;border:1px solid rgba(186,26,26,.2)">
            <span class="material-symbols-rounded text-[18px]">error</span>
            <span th:text="${error}">Erreur.</span>
        </div>
        <div th:if="${logout}"
             class="flex items-center gap-2 p-3 mb-4 rounded-xl text-[13px]"
             style="background:rgba(10,10,10,.05);border:1px solid var(--line)">
            <span class="material-symbols-rounded text-[18px]">check_circle</span>
            <span th:text="${logout}">Déconnecté.</span>
        </div>

        <form th:action="@{/admin-login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block font-mono text-[11px] uppercase tracking-wider text-muted mb-2">Email</label>
                <div class="relative">
                    <span class="material-symbols-rounded absolute left-3.5 top-1/2 -translate-y-1/2 text-muted text-[20px]">mail</span>
                    <input id="username" name="username" type="email" required
                           class="w-full h-12 pl-11 pr-4 rounded-xl bg-white/60 border border-line text-ink
                                  focus:outline-none focus:border-ink focus:ring-1 focus:ring-ink transition"
                           placeholder="admin@esatic.ci"/>
                </div>
            </div>
            <div>
                <label for="password" class="block font-mono text-[11px] uppercase tracking-wider text-muted mb-2">Mot de passe</label>
                <div class="relative">
                    <span class="material-symbols-rounded absolute left-3.5 top-1/2 -translate-y-1/2 text-muted text-[20px]">lock</span>
                    <input id="password" name="password" type="password" required
                           class="w-full h-12 pl-11 pr-4 rounded-xl bg-white/60 border border-line text-ink
                                  focus:outline-none focus:border-ink focus:ring-1 focus:ring-ink transition"
                           placeholder="••••••••"/>
                </div>
            </div>
            <button type="submit"
                    class="btn btn-ink w-full h-12 rounded-xl font-medium flex items-center justify-center gap-2 mt-2">
                Se connecter
                <span class="material-symbols-rounded text-[20px]">arrow_forward</span>
            </button>
        </form>
    </div>

    <p class="text-center font-mono text-[10px] uppercase tracking-[0.2em] text-muted mt-6">
        Système Intelligent de Gestion des Enseignements
    </p>
</main>

</body>
</html>
