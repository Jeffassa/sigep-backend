<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('SIGEP | Facultés')}"></head>
<body>

<div th:replace="~{admin/fragments :: topbar('facultes')}"></div>

<main class="max-w-[1240px] mx-auto px-5 md:px-8 py-10 pb-36">

    <div class="mb-8" data-reveal>
        <p class="font-mono text-[11px] uppercase tracking-[0.3em] text-muted mb-2">Établissement</p>
        <h1 class="font-serif text-[clamp(34px,5vw,52px)] leading-[1.02] tracking-tight">Facultés</h1>
    </div>

    <div th:if="${success}" class="glass rounded-2xl p-3.5 mb-5 flex items-center gap-2 text-[13px]" data-reveal>
        <span class="material-symbols-rounded text-[18px]">check_circle</span><span th:text="${success}">OK</span>
    </div>
    <div th:if="${error}" class="glass rounded-2xl p-3.5 mb-5 flex items-center gap-2 text-[13px]" data-reveal
         style="border-color:rgba(186,26,26,.3)">
        <span class="material-symbols-rounded text-[18px]">error</span><span th:text="${error}">Erreur</span>
    </div>

    <!-- Formulaire -->
    <form th:action="@{/admin/facultes}" method="post" class="glass rounded-3xl p-6 mb-6 grid grid-cols-1 md:grid-cols-4 gap-3 items-end" data-reveal>
        <div>
            <label class="block font-mono text-[10px] uppercase tracking-wider text-muted mb-2">Code</label>
            <input type="text" name="code" required maxlength="20" placeholder="ESATIC-SI"
                   class="w-full h-11 px-4 rounded-xl bg-white/55 border border-line focus:ring-0 focus:border-ink transition"/>
        </div>
        <div>
            <label class="block font-mono text-[10px] uppercase tracking-wider text-muted mb-2">Nom</label>
            <input type="text" name="nom" required maxlength="120" placeholder="Sciences Informatiques"
                   class="w-full h-11 px-4 rounded-xl bg-white/55 border border-line focus:ring-0 focus:border-ink transition"/>
        </div>
        <div>
            <label class="block font-mono text-[10px] uppercase tracking-wider text-muted mb-2">Description</label>
            <input type="text" name="description" maxlength="500" placeholder="Optionnel"
                   class="w-full h-11 px-4 rounded-xl bg-white/55 border border-line focus:ring-0 focus:border-ink transition"/>
        </div>
        <button type="submit" class="btn btn-ink h-11 rounded-xl font-medium flex items-center justify-center gap-2">
            <span class="material-symbols-rounded text-[20px]">add</span> Ajouter
        </button>
    </form>

    <!-- Table -->
    <div class="glass rounded-3xl overflow-hidden" data-reveal>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                <tr class="border-b border-line">
                    <th class="px-6 py-4 font-mono text-[10px] uppercase tracking-wider text-muted">Code</th>
                    <th class="px-6 py-4 font-mono text-[10px] uppercase tracking-wider text-muted">Nom</th>
                    <th class="px-6 py-4 font-mono text-[10px] uppercase tracking-wider text-muted">Description</th>
                    <th class="px-6 py-4 font-mono text-[10px] uppercase tracking-wider text-muted text-right">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${facultes.isEmpty()}">
                    <td colspan="4" class="px-6 py-16 text-center text-muted">
                        <span class="material-symbols-rounded text-[40px] block mb-2 opacity-40">account_balance</span>
                        Aucune faculté. Ajoutez-en une ci-dessus.
                    </td>
                </tr>
                <tr th:each="faculte : ${facultes}" class="zebra border-b border-line/60">
                    <td class="px-6 py-4 font-mono text-[13px] font-medium" th:text="${faculte.code}">CODE</td>
                    <td class="px-6 py-4 text-[14px] font-medium" th:text="${faculte.nom}">Nom</td>
                    <td class="px-6 py-4 text-[14px] text-muted" th:text="${faculte.description}">—</td>
                    <td class="px-6 py-4 text-right">
                        <form th:action="@{'/admin/facultes/' + ${faculte.id} + '/supprimer'}" method="post"
                              onsubmit="return confirm('Supprimer cette faculté ?');" class="inline">
                            <button type="submit" class="btn w-9 h-9 rounded-lg border border-line inline-flex items-center justify-center hover:bg-ink hover:text-white" title="Supprimer">
                                <span class="material-symbols-rounded text-[16px]">delete</span>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{admin/fragments :: dock('facultes')}"></div>
<div th:replace="~{admin/fragments :: palette}"></div>
<div th:replace="~{admin/fragments :: scripts}"></div>

</body>
</html>
