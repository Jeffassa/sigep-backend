<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('SIGEP | Enseignants')}"></head>
<body>

<div th:replace="~{admin/fragments :: topbar('enseignants')}"></div>

<main class="max-w-[1240px] mx-auto px-5 md:px-8 py-10 pb-36">

    <div class="flex flex-col md:flex-row md:items-end justify-between gap-5 mb-8" data-reveal>
        <div>
            <p class="font-mono text-[11px] uppercase tracking-[0.3em] text-muted mb-2">Corps enseignant</p>
            <h1 class="font-serif text-[clamp(34px,5vw,52px)] leading-[1.02] tracking-tight">Enseignants</h1>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <!-- Import en masse (Excel) : colonnes MATRICULE | NOM | PRENOM | DEPARTEMENT | GRADE -->
            <form th:action="@{/admin/enseignants/import}" method="post" enctype="multipart/form-data"
                  class="glass rounded-2xl h-12 px-3 flex items-center gap-2"
                  title="Colonnes : MATRICULE | NOM | PRENOM | DEPARTEMENT | GRADE">
                <input type="file" name="fichier" accept=".xlsx,.xls" required
                       class="text-[12px] max-w-[180px] file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-ink file:text-white file:cursor-pointer"/>
                <button type="submit" class="btn h-9 px-3 rounded-xl bg-ink text-white flex items-center gap-1 text-[13px]">
                    <span class="material-symbols-rounded text-[18px]">upload_file</span> Importer
                </button>
            </form>
            <a th:href="@{/admin/enseignants/nouveau}"
               class="btn btn-ink h-12 px-6 rounded-2xl flex items-center gap-2 text-[14px] font-medium w-fit">
                <span class="material-symbols-rounded text-[20px]">person_add</span> Ajouter
            </a>
        </div>
    </div>

    <div th:if="${success}" class="glass rounded-2xl p-3.5 mb-5 flex items-center gap-2 text-[13px]" data-reveal
         style="background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35)">
        <span class="material-symbols-rounded text-[18px]" style="color:#10b981">check_circle</span><span th:text="${success}">OK</span>
    </div>
    <div th:if="${error}" class="glass rounded-2xl p-3.5 mb-5 flex items-center gap-2 text-[13px]" data-reveal>
        <span class="material-symbols-rounded text-[18px]">error</span><span th:text="${error}">Erreur</span>
    </div>

    <!-- Filtres -->
    <form th:action="@{/admin/enseignants}" method="get" class="glass rounded-2xl p-2 mb-5 flex flex-col sm:flex-row gap-2" data-reveal>
        <div class="flex items-center gap-2 px-3 flex-grow">
            <span class="material-symbols-rounded text-muted">search</span>
            <input type="text" name="search" th:value="${search}" placeholder="Nom, prénom, matricule…"
                   class="bg-transparent border-0 focus:ring-0 w-full text-[15px] py-2.5 placeholder:text-muted"/>
        </div>
        <select name="departement"
                class="bg-white/50 border border-line rounded-xl px-3 text-[14px] focus:ring-0 focus:border-ink cursor-pointer">
            <option value="" th:selected="${departement == ''}">Tous les départements</option>
            <option th:each="dept : ${departements}" th:value="${dept}" th:text="${dept}" th:selected="${dept == departement}">Dépt</option>
        </select>
        <button type="submit" class="btn btn-ink rounded-xl px-5 h-11 flex items-center justify-center">
            <span class="material-symbols-rounded">search</span>
        </button>
    </form>

    <!-- Table -->
    <div class="glass rounded-3xl overflow-hidden" data-reveal>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                <tr class="border-b border-line">
                    <th class="px-6 py-4 font-mono text-[10px] uppercase tracking-wider text-muted">Enseignant</th>
                    <th class="px-6 py-4 font-mono text-[10px] uppercase tracking-wider text-muted">Département</th>
                    <th class="px-6 py-4 font-mono text-[10px] uppercase tracking-wider text-muted">Grade</th>
                    <th class="px-6 py-4 font-mono text-[10px] uppercase tracking-wider text-muted">Statut</th>
                    <th class="px-6 py-4 font-mono text-[10px] uppercase tracking-wider text-muted text-right">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${enseignants.isEmpty()}">
                    <td colspan="5" class="px-6 py-16 text-center text-muted">
                        <span class="material-symbols-rounded text-[40px] block mb-2 opacity-40">search_off</span>
                        Aucun enseignant trouvé.
                    </td>
                </tr>
                <tr th:each="ens : ${enseignants.content}" class="zebra border-b border-line/60">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-ink text-white flex items-center justify-center font-serif text-[15px] shrink-0"
                                 th:text="${#strings.substring(ens.nom,0,1) + #strings.substring(ens.prenom,0,1)}">AB</div>
                            <div>
                                <p class="text-[14px] font-medium" th:text="${ens.nom + ' ' + ens.prenom}">Nom</p>
                                <p class="font-mono text-[11px] text-muted" th:text="${ens.matricule}">MAT</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-[14px] text-muted" th:text="${ens.departement ?: '—'}">Dépt</td>
                    <td class="px-6 py-4 text-[14px] text-muted" th:text="${ens.grade ?: '—'}">Grade</td>
                    <td class="px-6 py-4">
                        <span th:if="${ens.statut?.name() == 'VALIDATED'}"
                              class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-ink text-white font-mono text-[10px] uppercase tracking-wider">
                            <span class="material-symbols-rounded text-[13px] fill">check</span>Validé</span>
                        <span th:if="${ens.statut?.name() == 'PENDING'}"
                              class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border border-ink font-mono text-[10px] uppercase tracking-wider">
                            <span class="material-symbols-rounded text-[13px]">schedule</span>Attente</span>
                        <span th:if="${ens.statut?.name() == 'REJECTED'}"
                              class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border border-line text-muted font-mono text-[10px] uppercase tracking-wider">
                            <span class="material-symbols-rounded text-[13px]">block</span>Rejeté</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center justify-end gap-2">
                            <form th:action="@{'/admin/enseignants/' + ${ens.id} + '/statut'}" method="post" class="flex items-center gap-1">
                                <select name="statut" class="bg-white/50 border border-line rounded-lg px-2 py-1 text-[12px] focus:ring-0 focus:border-ink">
                                    <option value="VALIDATED" th:selected="${ens.statut?.name() == 'VALIDATED'}">Valider</option>
                                    <option value="PENDING"   th:selected="${ens.statut?.name() == 'PENDING'}">Attente</option>
                                    <option value="REJECTED"  th:selected="${ens.statut?.name() == 'REJECTED'}">Rejeter</option>
                                </select>
                                <button type="submit" class="btn w-8 h-8 rounded-lg bg-ink text-white flex items-center justify-center" title="Appliquer">
                                    <span class="material-symbols-rounded text-[16px]">check</span>
                                </button>
                            </form>
                            <form th:action="@{'/admin/enseignants/' + ${ens.id} + '/supprimer'}" method="post"
                                  onsubmit="return confirm('Supprimer cet enseignant ?')">
                                <button type="submit" class="btn w-8 h-8 rounded-lg border border-line flex items-center justify-center hover:bg-ink hover:text-white" title="Supprimer">
                                    <span class="material-symbols-rounded text-[16px]">delete</span>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <!-- Pagination -->
        <div class="px-6 py-4 border-t border-line flex items-center justify-between">
            <p class="font-mono text-[11px] text-muted">
                <span th:text="${enseignants.numberOfElements}">0</span> / <span th:text="${totalElements}">0</span>
            </p>
            <div class="flex gap-1.5">
                <a th:if="${currentPage > 0}" th:href="@{/admin/enseignants(search=${search}, departement=${departement}, page=${currentPage - 1})}"
                   class="btn glass w-9 h-9 rounded-lg flex items-center justify-center"><span class="material-symbols-rounded text-[18px]">chevron_left</span></a>
                <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:if="${i != currentPage}" th:href="@{/admin/enseignants(search=${search}, departement=${departement}, page=${i})}"
                       class="btn glass w-9 h-9 rounded-lg flex items-center justify-center font-mono text-[12px]" th:text="${i + 1}">1</a>
                    <span th:if="${i == currentPage}" class="w-9 h-9 rounded-lg bg-ink text-white flex items-center justify-center font-mono text-[12px]" th:text="${i + 1}">1</span>
                </th:block>
                <a th:if="${currentPage < totalPages - 1}" th:href="@{/admin/enseignants(search=${search}, departement=${departement}, page=${currentPage + 1})}"
                   class="btn glass w-9 h-9 rounded-lg flex items-center justify-center"><span class="material-symbols-rounded text-[18px]">chevron_right</span></a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{admin/fragments :: dock('enseignants')}"></div>
<div th:replace="~{admin/fragments :: palette}"></div>
<div th:replace="~{admin/fragments :: scripts}"></div>

</body>
</html>
