<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('SIGEP | Enseignants')}"></head>
<body>

<div th:replace="~{admin/fragments :: topbar('enseignants')}"></div>

<main class="max-w-[1240px] mx-auto px-5 md:px-8 py-10 pb-36">

    <div class="en-tete-page" data-reveal>
        <div>
            <p class="surtitre">Corps enseignant</p>
            <h1 class="titre-page">Enseignants</h1>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <!-- Import en masse (Excel). EMAIL est facultative mais determinante : renseignee,
                 elle cree le compte et envoie un mot de passe provisoire a l'enseignant. -->
            <form th:action="@{/admin/enseignants/import}" method="post" enctype="multipart/form-data"
                  class="flex items-center gap-2"
                  title="Colonnes : MATRICULE | NOM | PRENOM | DEPARTEMENT | GRADE | EMAIL&#10;La colonne EMAIL est facultative. Si vous la remplissez, le compte est créé et les accès partent par courriel.">
                <input type="file" name="fichier" accept=".xlsx,.xls" required
                       class="text-[12px] max-w-[180px] file:mr-2 file:py-1 file:px-2 file:border-0 file:bg-ink file:text-white file:cursor-pointer"/>
                <button type="submit" class="btn glass h-11 px-4 flex items-center gap-1 text-[14px] font-medium">
                    <span class="material-symbols-rounded text-[18px]">upload_file</span> Importer
                </button>
            </form>
            <a th:href="@{/admin/enseignants/nouveau}"
               class="btn btn-ink h-11 px-5 flex items-center gap-2 text-[14px] font-medium w-fit">
                <span class="material-symbols-rounded text-[20px]">person_add</span> Ajouter
            </a>
        </div>
    </div>

    <div data-flash th:if="${success}" class="feuille mb-5 flex items-center gap-2 text-[13px]" data-reveal
         style="background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35)">
        <svg th:replace="~{admin/fragments :: coche}"></svg><span th:text="${success}">OK</span>
    </div>
    <div data-flash th:if="${error}" class="feuille mb-5 flex items-center gap-2 text-[13px]" data-reveal>
        <span th:text="${error}">Erreur</span>
    </div>

    <!-- Filtres -->
    <form th:action="@{/admin/enseignants}" method="get" class="barre-filtre" data-reveal>
        <div class="flex items-center gap-2 px-3 flex-grow">
            <span class="material-symbols-rounded text-muted">search</span>
            <input type="text" name="search" th:value="${search}" placeholder="Nom, prénom, matricule…"
                   class="bg-transparent border-0 w-full h-11 text-[15px] placeholder:text-muted"/>
        </div>
        <select name="departement" class="champ h-11 px-3 text-[14px] cursor-pointer">
            <option value="" th:selected="${departement == ''}">Tous les départements</option>
            <option th:each="dept : ${departements}" th:value="${dept}" th:text="${dept}" th:selected="${dept == departement}">Dépt</option>
        </select>
        <label class="flex items-center gap-2 px-3 text-[13px] text-muted cursor-pointer select-none whitespace-nowrap"
               title="Les enseignants archivés sont masqués par défaut">
            <input type="checkbox" name="archives" value="true" th:checked="${archives}"
                   onchange="if(this.form.requestSubmit)this.form.requestSubmit();else this.form.submit()"
                   class="w-4 h-4 rounded border-line accent-current cursor-pointer"/>
            Voir les archivés
        </label>
        <button type="submit" class="btn btn-ink px-4 h-11 flex items-center justify-center" aria-label="Rechercher">
            <span class="material-symbols-rounded">search</span>
        </button>
    </form>

    <!-- Table -->
    <div class="chapitre" data-reveal>
        <div class="overflow-x-auto">
            <table class="registre">
                <thead>
                <tr>
                    <th>Enseignant</th>
                    <th>Département</th>
                    <th>Grade</th>
                    <th>Statut</th>
                    <th class="text-right">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${enseignants.isEmpty()}">
                    <td colspan="5" class="vide">
                        Aucun enseignant dans cette liste.
                    </td>
                </tr>
                <tr th:each="ens : ${enseignants.content}">
                    <td>
                        <div class="flex items-center gap-3">
                            <div class="pastille"
                                 th:text="${#strings.substring(ens.nom,0,1) + #strings.substring(ens.prenom,0,1)}">AB</div>
                            <div>
                                <p class="text-[14px] font-medium" th:text="${ens.nom + ' ' + ens.prenom}">Nom</p>
                                <p class="font-mono text-[11px] text-muted" th:text="${ens.matricule}">MAT</p>
                            </div>
                        </div>
                    </td>
                    <td class="discret" th:text="${ens.departement ?: '—'}">Dépt</td>
                    <td class="discret" th:text="${ens.grade ?: '—'}">Grade</td>
                    <td>
                        <span th:if="${ens.statut?.name() == 'VALIDATED'}"
                              class="visa">VALIDÉ</span>
                        <span th:if="${ens.statut?.name() == 'PENDING'}"
                              class="etat">Attente</span>
                        <span th:if="${ens.statut?.name() == 'REJECTED'}"
                              class="etat etat-discret">Rejeté</span>
                        <span th:if="${ens.statut?.name() == 'ARCHIVE'}"
                              class="etat etat-discret"
                              title="A quitté l'établissement. Aucun accès, historique conservé.">
                            <span class="material-symbols-rounded text-[13px]">inventory_2</span>Archivé</span>
                    </td>
                    <td>
                        <div class="flex items-center justify-end gap-2">
                            <form th:action="@{'/admin/enseignants/' + ${ens.id} + '/statut'}" method="post" class="flex items-center gap-1">
                                <!-- La liste que l'administrateur a sous les yeux : recherche, département,
                                     page et affichage des archivés. Sans eux, l'action le renvoyait au début
                                     d'une liste complète, sans le filtre qui lui avait permis de trouver
                                     l'enseignant — et sans l'enseignant, qui venait d'en sortir. -->
                                <input type="hidden" name="search" th:value="${search}"/>
                                <input type="hidden" name="departement" th:value="${departement}"/>
                                <input type="hidden" name="archives" th:value="${archives}"/>
                                <input type="hidden" name="page" th:value="${currentPage}"/>
                                <select name="statut" class="champ h-9 px-2 text-[13px] w-[128px]">
                                    <option value="VALIDATED" th:selected="${ens.statut?.name() == 'VALIDATED'}">Valider</option>
                                    <option value="PENDING"   th:selected="${ens.statut?.name() == 'PENDING'}">Mettre en attente</option>
                                    <option value="REJECTED"  th:selected="${ens.statut?.name() == 'REJECTED'}">Rejeter</option>
                                    <option value="ARCHIVE"   th:selected="${ens.statut?.name() == 'ARCHIVE'}">Archiver</option>
                                </select>
                                <button type="submit" class="bouton-ligne" title="Appliquer" aria-label="Appliquer le statut">
                                    <span class="material-symbols-rounded text-[16px]">check</span>
                                </button>
                            </form>
                            <form th:if="${ens.user != null}"
                                  th:action="@{'/admin/enseignants/' + ${ens.id} + '/renvoyer-acces'}" method="post"
                                  onsubmit="return confirm('Générer un nouveau mot de passe provisoire et l\'envoyer par e-mail ? L\'ancien cessera de fonctionner.')">
                                <input type="hidden" name="search" th:value="${search}"/>
                                <input type="hidden" name="departement" th:value="${departement}"/>
                                <input type="hidden" name="archives" th:value="${archives}"/>
                                <input type="hidden" name="page" th:value="${currentPage}"/>
                                <button type="submit" class="bouton-ligne" title="Renvoyer les accès par e-mail">
                                    <span class="material-symbols-rounded text-[16px]">forward_to_inbox</span>
                                </button>
                            </form>
                            <form th:action="@{'/admin/enseignants/' + ${ens.id} + '/supprimer'}" method="post"
                                  onsubmit="return confirm('Supprimer cet enseignant ?')">
                                <input type="hidden" name="search" th:value="${search}"/>
                                <input type="hidden" name="departement" th:value="${departement}"/>
                                <input type="hidden" name="archives" th:value="${archives}"/>
                                <input type="hidden" name="page" th:value="${currentPage}"/>
                                <button type="submit" class="bouton-ligne" title="Supprimer">
                                    <span class="material-symbols-rounded text-[16px]">delete</span>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <!-- Pagination -->
        <div class="py-4 flex items-center justify-between">
            <p class="font-mono text-[11px] text-muted">
                <span th:text="${enseignants.numberOfElements}">0</span> / <span th:text="${totalElements}">0</span>
            </p>
            <div class="flex gap-1.5">
                <a th:if="${currentPage > 0}" th:href="@{/admin/enseignants(search=${search}, departement=${departement}, archives=${archives}, page=${currentPage - 1})}"
                   class="btn glass w-9 h-9 rounded-lg flex items-center justify-center"><span class="material-symbols-rounded text-[18px]">chevron_left</span></a>
                <!-- Le th:if est porté par un bloc EXTÉRIEUR : th:each s'évalue avant th:if sur
                     une même balise, et la séquence serait construite malgré tout. Quand la liste
                     est vide, totalPages vaut 0 et sequence(0, -1) ne rend pas une liste vide mais
                     [0, -1] — d'où deux pastilles « 1 » et « 0 » menant à une page négative que le
                     serveur refuse. C'est ce qui arrivait après avoir archivé le dernier résultat
                     d'une recherche. -->
                <th:block th:if="${totalPages > 0}">
                    <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                        <a th:if="${i != currentPage}" th:href="@{/admin/enseignants(search=${search}, departement=${departement}, archives=${archives}, page=${i})}"
                           class="btn glass w-9 h-9 rounded-lg flex items-center justify-center font-mono text-[12px]" th:text="${i + 1}">1</a>
                        <span th:if="${i == currentPage}" class="w-9 h-9 rounded-lg bg-ink text-white flex items-center justify-center font-mono text-[12px]" th:text="${i + 1}">1</span>
                    </th:block>
                </th:block>
                <a th:if="${currentPage < totalPages - 1}" th:href="@{/admin/enseignants(search=${search}, departement=${departement}, archives=${archives}, page=${currentPage + 1})}"
                   class="btn glass w-9 h-9 rounded-lg flex items-center justify-center"><span class="material-symbols-rounded text-[18px]">chevron_right</span></a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{admin/fragments :: dock('enseignants')}"></div>
<div th:replace="~{admin/fragments :: palette}"></div>
<div th:replace="~{admin/fragments :: scripts}"></div>

</body>
</html>
