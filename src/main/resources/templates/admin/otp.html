<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" data-toujours-clair>
<head th:replace="~{admin/fragments :: head('SIGEP | Vérification')}" />
<body class="porte">
<aside class="porte-nuit">
    <a th:href="@{/}" class="marque">SIGEP</a>
    <p class="accroche">Une dernière <em>signature.</em></p>
</aside>
<div class="porte-page">
<main>
  <h1 class="titre-page">Code envoyé</h1>
  <p class="text-[15px] text-muted mb-6">Saisissez le code reçu par e-mail.</p>
  <div class="feuille">
    <div th:if="${error}" class="note note-alerte" th:text="${error}">Erreur</div>
    <div th:if="${info}" class="note note-ok" th:text="${info}">Information</div>
    <form th:action="@{/admin-otp}" method="post" class="space-y-4">
      <label for="code" class="etiquette">Code à 6 chiffres</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required class="w-full h-12 px-4 champ text-ink text-center tracking-[.4em] text-xl" />
      <button type="submit" class="btn btn-ink w-full h-12 rounded-xl font-medium">Vérifier</button>
    </form>

    <form th:action="@{/admin-otp/renvoyer}" method="post" class="mt-4 text-center">
      <button type="submit" class="text-[13px] text-muted hover:text-ink underline underline-offset-4">
        Renvoyer un code
      </button>
    </form>
    <p class="text-[12px] text-muted text-center mt-4">Valable 5 minutes. Pensez aux courriers indésirables.</p>
  </div>
</main>
</div>
</body>
</html>
