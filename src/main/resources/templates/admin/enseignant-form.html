<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('SIGEP | Nouvel Enseignant')}"></head>
<body class="bg-[#f8f9fb] text-on-surface min-h-screen">

<!-- TopBar -->
<div th:replace="~{admin/fragments :: topbar('enseignants')}"></div>

<main class="max-w-[800px] mx-auto px-4 md:px-6 py-8">

    <!-- En-tête -->
    <div class="flex items-center gap-4 mb-8">
        <a th:href="@{/admin/enseignants}"
           class="p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div>
            <h1 class="text-[28px] font-bold text-primary">Nouvel Enseignant</h1>
            <p class="text-on-surface-variant text-[14px]">Remplissez les informations pour créer un compte enseignant.</p>
        </div>
    </div>

    <!-- Alertes flash -->
    <div th:if="${error}"
         class="flex items-center gap-2 p-3 mb-6 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
        <span class="material-symbols-outlined text-[18px]">error</span>
        <span th:text="${error}">Erreur.</span>
    </div>

    <!-- Formulaire -->
    <div class="bg-white border border-outline-variant rounded-2xl p-8 shadow-sm">
        <form th:action="@{/admin/enseignants}" method="post" class="space-y-6">

            <!-- Ligne 1 : Matricule -->
            <div>
                <label class="block text-[13px] font-bold text-on-surface-variant uppercase tracking-wider mb-2">
                    Matricule <span class="text-error">*</span>
                </label>
                <input type="text" name="matricule" required
                       class="w-full h-11 px-4 border border-outline-variant rounded-lg bg-surface-container-low text-on-surface
                              focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
                       placeholder="Ex: ENS-2026-001"/>
            </div>

            <!-- Ligne 2 : Nom + Prénom -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[13px] font-bold text-on-surface-variant uppercase tracking-wider mb-2">
                        Nom <span class="text-error">*</span>
                    </label>
                    <input type="text" name="nom" required
                           class="w-full h-11 px-4 border border-outline-variant rounded-lg bg-surface-container-low text-on-surface
                                  focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
                           placeholder="Nom de famille"/>
                </div>
                <div>
                    <label class="block text-[13px] font-bold text-on-surface-variant uppercase tracking-wider mb-2">
                        Prénom <span class="text-error">*</span>
                    </label>
                    <input type="text" name="prenom" required
                           class="w-full h-11 px-4 border border-outline-variant rounded-lg bg-surface-container-low text-on-surface
                                  focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
                           placeholder="Prénom"/>
                </div>
            </div>

            <!-- Ligne 3 : Email + Mot de passe -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[13px] font-bold text-on-surface-variant uppercase tracking-wider mb-2">
                        Email <span class="text-error">*</span>
                    </label>
                    <input type="email" name="email" required
                           class="w-full h-11 px-4 border border-outline-variant rounded-lg bg-surface-container-low text-on-surface
                                  focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
                           placeholder="enseignant@esatic.ci"/>
                </div>
                <div>
                    <label class="block text-[13px] font-bold text-on-surface-variant uppercase tracking-wider mb-2">
                        Mot de passe <span class="text-error">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" name="password" id="passwordField" required minlength="8"
                               pattern="^(?=.*[A-Za-z])(?=.*\d).+$"
                               title="Au moins 8 caractères, avec une lettre et un chiffre"
                               class="w-full h-11 px-4 pr-10 border border-outline-variant rounded-lg bg-surface-container-low text-on-surface
                                      focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
                               placeholder="Min. 8 caractères, 1 lettre + 1 chiffre"/>
                        <button type="button" onclick="togglePassword()"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Ligne 4 : Département + Grade -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[13px] font-bold text-on-surface-variant uppercase tracking-wider mb-2">
                        Département
                    </label>
                    <input type="text" name="departement"
                           list="dept-list"
                           class="w-full h-11 px-4 border border-outline-variant rounded-lg bg-surface-container-low text-on-surface
                                  focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
                           placeholder="Ex: Informatique"/>
                    <datalist id="dept-list">
                        <option th:each="dept : ${departements}" th:value="${dept}"></option>
                    </datalist>
                </div>
                <div>
                    <label class="block text-[13px] font-bold text-on-surface-variant uppercase tracking-wider mb-2">
                        Grade
                    </label>
                    <select name="grade"
                            class="w-full h-11 px-4 border border-outline-variant rounded-lg bg-surface-container-low text-on-surface
                                   focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                        <option value="">-- Sélectionner --</option>
                        <option value="Professeur Titulaire">Professeur Titulaire</option>
                        <option value="Maître de Conférences">Maître de Conférences</option>
                        <option value="Maître Assistant">Maître Assistant</option>
                        <option value="Assistant">Assistant</option>
                        <option value="Chargé de Cours">Chargé de Cours</option>
                        <option value="Vacataire">Vacataire</option>
                    </select>
                </div>
            </div>

            <!-- Boutons -->
            <div class="flex items-center justify-end gap-4 pt-4 border-t border-outline-variant">
                <a th:href="@{/admin/enseignants}"
                   class="px-6 py-2.5 border border-outline-variant rounded-xl text-[14px] font-semibold text-on-surface-variant
                          hover:bg-surface-container transition-colors">
                    Annuler
                </a>
                <button type="submit"
                        class="px-6 py-2.5 bg-primary text-white rounded-xl text-[14px] font-semibold
                               hover:opacity-90 active:scale-95 transition-all shadow-sm">
                    <span class="material-symbols-outlined text-[18px] align-middle mr-1">person_add</span>
                    Créer l'enseignant
                </button>
            </div>
        </form>
    </div>
</main>

<script>
    function togglePassword() {
        const field = document.getElementById('passwordField');
        const icon = document.getElementById('eyeIcon');
        if (field.type === 'password') {
            field.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            field.type = 'password';
            icon.textContent = 'visibility';
        }
    }
</script>
</body>
</html>
