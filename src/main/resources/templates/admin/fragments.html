<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ===================== HEAD COMMUN ===================== -->
<head th:fragment="head(pageTitle)">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title th:text="${pageTitle}">SIGEP</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fb; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .fill-icon { font-variation-settings: 'FILL' 1; }
        .tonal-card { background: #ffffff; border: 1px solid #c6c5d4; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .tonal-card:hover { box-shadow: 0px 4px 12px rgba(26, 35, 126, 0.08); transform: translateY(-2px); }
        .zebra-stripe:nth-child(even) { background-color: #f2f4f6; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#000666", "on-primary": "#ffffff",
                        "primary-container": "#1a237e", "on-primary-container": "#8690ee",
                        "primary-fixed": "#e0e0ff", "primary-fixed-dim": "#bdc2ff",
                        "on-primary-fixed": "#000767", "on-primary-fixed-variant": "#343d96",
                        "inverse-primary": "#bdc2ff", "surface-tint": "#4c56af",
                        "secondary": "#795900", "on-secondary": "#ffffff",
                        "secondary-container": "#fec330", "on-secondary-container": "#6f5100",
                        "secondary-fixed": "#ffdfa0", "secondary-fixed-dim": "#f8bd2a",
                        "on-secondary-fixed": "#261a00", "on-secondary-fixed-variant": "#5c4300",
                        "tertiary": "#071e27", "on-tertiary": "#ffffff",
                        "tertiary-container": "#1e333c", "on-tertiary-container": "#859ba6",
                        "tertiary-fixed": "#cfe6f2", "tertiary-fixed-dim": "#b4cad6",
                        "on-tertiary-fixed": "#071e27", "on-tertiary-fixed-variant": "#354a53",
                        "error": "#ba1a1a", "on-error": "#ffffff",
                        "error-container": "#ffdad6", "on-error-container": "#93000a",
                        "background": "#f8f9fb", "on-background": "#191c1e",
                        "surface": "#f8f9fb", "on-surface": "#191c1e",
                        "surface-variant": "#e0e3e5", "on-surface-variant": "#454652",
                        "surface-dim": "#d8dadc", "surface-bright": "#f8f9fb",
                        "surface-container-lowest": "#ffffff", "surface-container-low": "#f2f4f6",
                        "surface-container": "#eceef0", "surface-container-high": "#e6e8ea",
                        "surface-container-highest": "#e0e3e5",
                        "outline": "#767683", "outline-variant": "#c6c5d4",
                        "inverse-surface": "#2d3133", "inverse-on-surface": "#eff1f3"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                    "spacing": {
                        "xl": "64px", "lg": "48px", "md": "24px", "sm": "12px", "base": "8px", "xs": "4px",
                        "gutter": "24px", "margin-mobile": "16px", "container-max": "1280px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"], "label-md": ["Inter"], "headline-md": ["Inter"],
                        "headline-lg": ["Inter"], "body-sm": ["Inter"], "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"], "headline-xl": ["Inter"], "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-xl": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
</head>

<body>

<!-- ===================== TOP APP BAR ===================== -->
<header th:fragment="topbar(active)" class="bg-surface border-b border-outline-variant sticky top-0 z-40">
    <div class="flex justify-between items-center w-full px-margin-mobile md:px-gutter max-w-container-max mx-auto h-16">
        <div class="flex items-center gap-4">
            <span class="font-headline-lg text-headline-lg font-black text-primary tracking-tight">SIGEP</span>
            <nav class="hidden md:flex gap-1 ml-6">
                <a th:href="@{/admin/dashboard}"
                   th:classappend="${active == 'dashboard'} ? 'text-primary font-bold bg-surface-container-high' : 'text-on-surface-variant hover:bg-surface-container-high'"
                   class="font-label-md text-label-md px-3 py-1.5 rounded-lg transition-colors">Dashboard</a>
                <a th:href="@{/admin/enseignants}"
                   th:classappend="${active == 'enseignants'} ? 'text-primary font-bold bg-surface-container-high' : 'text-on-surface-variant hover:bg-surface-container-high'"
                   class="font-label-md text-label-md px-3 py-1.5 rounded-lg transition-colors">Enseignants</a>
                <a th:href="@{/admin/rapports}"
                   th:classappend="${active == 'rapports'} ? 'text-primary font-bold bg-surface-container-high' : 'text-on-surface-variant hover:bg-surface-container-high'"
                   class="font-label-md text-label-md px-3 py-1.5 rounded-lg transition-colors">Reports</a>
                <a th:href="@{/admin/facultes}"
                   th:classappend="${active == 'facultes'} ? 'text-primary font-bold bg-surface-container-high' : 'text-on-surface-variant hover:bg-surface-container-high'"
                   class="font-label-md text-label-md px-3 py-1.5 rounded-lg transition-colors">Facultés</a>
                <a th:href="@{/admin/alertes}"
                   th:classappend="${active == 'alertes'} ? 'text-primary font-bold bg-surface-container-high' : 'text-on-surface-variant hover:bg-surface-container-high'"
                   class="font-label-md text-label-md px-3 py-1.5 rounded-lg transition-colors">Alertes</a>
            </nav>
        </div>
        <div class="flex items-center gap-3">
            <a th:href="@{/admin/alertes}"
               class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors relative"
               title="Alertes">
                <span class="material-symbols-outlined">notifications</span>
                <span id="topbarAlertBadge" th:if="${alertesCount != null and alertesCount > 0}" th:text="${alertesCount}"
                      class="absolute top-0 right-0 min-w-[16px] h-[16px] px-1 flex items-center justify-center bg-error text-on-error text-[10px] font-bold rounded-full">0</span>
            </a>
            <div class="flex items-center gap-3 pl-3 border-l border-outline-variant">
                <div class="text-right hidden sm:block">
                    <p class="font-label-md text-label-md font-bold text-on-surface">Admin Principal</p>
                    <p class="font-label-sm text-label-sm text-on-surface-variant">Administration Centrale</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-on-primary font-bold text-label-md">AP</div>
                <a th:href="@{/admin/logout}"
                   class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors"
                   title="Déconnexion">
                    <span class="material-symbols-outlined">logout</span>
                </a>
            </div>
        </div>
    </div>
</header>

<!-- ===================== BOTTOM NAV MOBILE ===================== -->
<nav th:fragment="bottomnav(active)"
     class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-surface border-t border-outline-variant py-2 px-4 shadow-lg">
    <a th:href="@{/admin/dashboard}"
       th:classappend="${active == 'dashboard'} ? 'bg-secondary-container text-on-secondary-container rounded-full px-4 py-1' : 'text-on-surface-variant p-2'"
       class="flex flex-col items-center justify-center transition-transform active:scale-95">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="font-label-sm text-label-sm">Home</span>
    </a>
    <a th:href="@{/admin/enseignants}"
       th:classappend="${active == 'enseignants'} ? 'bg-secondary-container text-on-secondary-container rounded-full px-4 py-1' : 'text-on-surface-variant p-2'"
       class="flex flex-col items-center justify-center transition-transform active:scale-95">
        <span class="material-symbols-outlined">group</span>
        <span class="font-label-sm text-label-sm">Enseignants</span>
    </a>
    <a th:href="@{/admin/rapports}"
       th:classappend="${active == 'rapports'} ? 'bg-secondary-container text-on-secondary-container rounded-full px-4 py-1' : 'text-on-surface-variant p-2'"
       class="flex flex-col items-center justify-center transition-transform active:scale-95">
        <span class="material-symbols-outlined">description</span>
        <span class="font-label-sm text-label-sm">Reports</span>
    </a>
    <a th:href="@{/admin/alertes}"
       th:classappend="${active == 'alertes'} ? 'bg-secondary-container text-on-secondary-container rounded-full px-4 py-1' : 'text-on-surface-variant p-2'"
       class="flex flex-col items-center justify-center transition-transform active:scale-95">
        <span class="material-symbols-outlined">notifications</span>
        <span class="font-label-sm text-label-sm">Alertes</span>
    </a>
</nav>

</body>
</html>
