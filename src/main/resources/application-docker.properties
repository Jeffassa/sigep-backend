# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:sigep_db}
spring.datasource.username=${DB_USER:sigep_user}
spring.datasource.password=${DB_PASSWORD:sigep_password}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# JWT Secrets (namespace app.jwt.* : identique au code Java et au garde de démarrage).
# SECURITE : aucun repli en dur — JWT_SECRET / JWT_QR_SECRET sont OBLIGATOIRES en variable
# d'environnement (min 256 bits, base64), fournis via env_file (.env.docker). Sinon le
# placeholder non résolu empêche le démarrage (fail-closed) plutôt que de signer avec une clé connue.
app.jwt.secret=${JWT_SECRET}
app.jwt.qr-secret=${JWT_QR_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# Logging
logging.level.root=INFO
logging.level.ci.esatic.sigep=DEBUG