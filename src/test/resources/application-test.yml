spring:
  datasource:
    url: jdbc:h2:mem:sigep_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Tests sur H2 : schéma créé par Hibernate, pas de Flyway (migrations PostgreSQL).
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

