events {
    worker_connections 1024;
}

http {
    # Résolution DNS interne pour Docker Compose
    resolver 127.0.0.11 valid=30s;

    # Upstream : Groupe de serveurs applicatifs
    upstream spring_boot_app {
        server app:8080;
        # Docker gérera automatiquement l'ajout des autres instances lors du scale
    }

    server{
        listen 80;
        server_name localhost;

        # Logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Max body size pour les uploads (ex: import Excel)
        client_max_body_size 20M;

        location / {
            proxy_pass http://spring_boot_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}