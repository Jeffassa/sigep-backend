name: Security

# Analyse de sécurité : vulnérabilités des dépendances, secrets, mauvaises configurations.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # tous les lundis 06h00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy (deps + secrets + IaC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Scan complet → SARIF (remonté dans l'onglet Security), NON bloquant.
      - name: Scan du système de fichiers (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Publier les résultats dans l'onglet Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # 2) Gate BLOQUANT : échoue la CI en présence d'une vulnérabilité CRITICAL ou HIGH corrigeable.
      - name: Gate CRITICAL+HIGH (bloquant)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'
