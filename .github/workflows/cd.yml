name: CD

# Déploiement continu : construit une image Docker du backend et la publie
# sur le GitHub Container Registry (ghcr.io) à chaque fusion sur main.
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # déclenchement manuel possible

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    name: Image Docker → GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image (Spring Boot buildpacks) et la publier
        run: |
          chmod +x mvnw
          ./mvnw -B spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.imageName=ghcr.io/jeffassa/sigep-backend:latest \
            -Dspring-boot.build-image.publish=true \
            -Ddocker.publishRegistry.username=${{ github.actor }} \
            -Ddocker.publishRegistry.password=${{ secrets.GITHUB_TOKEN }}
