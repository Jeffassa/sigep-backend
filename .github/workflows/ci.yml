name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Build + tests (unitaires & intégration sur H2)
        run: ./mvnw -B clean verify

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publier le JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sigep-backend-jar
          path: target/*.jar
          if-no-files-found: ignore
